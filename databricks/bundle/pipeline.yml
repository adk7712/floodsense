# Lakeflow pipeline `floodsense` (live id c32feb3d-5e5f-4c78-8219-e3acf131e804).
# Mirrors databricks/pipelines/pipeline_spec.json and the live settings.
resources:
  pipelines:
    floodsense:
      name: floodsense
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      continuous: false
      development: true
      channel: CURRENT
      libraries:
        - file:
            path: ${var.workspace_dir}/lakeflow_pipeline.py
      configuration:
        floodsense.root_dir: /Volumes/workspace/floodsense/artifacts/root
        floodsense.landing_path: /Volumes/workspace/floodsense/landing/rainfall
        floodsense.schema_path: /Volumes/workspace/floodsense/autoloader/bronze
        floodsense.gold_hours: "24"
        floodsense.model_uri: models:/workspace.floodsense.flood_model@champion
      environment:
        dependencies:
          - ${var.wheel_path}
          - scikit-learn==1.9.1
          - mlflow-skinny
