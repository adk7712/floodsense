# The three live jobs. Schedules and pause states match the workspace on 22 Oct 2026:
#   floodsense-rainfall-poller  PAUSED   (stays paused until 24 Oct)
#   floodsense-daily-archiver   UNPAUSED
#   floodsense-flood-alerts     UNPAUSED
# Scripts are the files already uploaded to ${var.workspace_dir} (see DEPLOYMENT.md); the bundle
# does not upload them.
# floodsense-telegram-alerts (databricks/jobs/telegram_alerts_job.json) is a paused fallback
# that was never created in the workspace, so it is not described here.
resources:
  jobs:
    rainfall_poller:
      name: floodsense-rainfall-poller
      description: "Lands recent NEA rainfall in the landing volume, runs the floodsense pipeline (triggered update, not a full refresh), then posts Telegram alerts from the newest gold step. The bot reads its token and chat id from the secrets scope 'floodsense' (telegram_bot_token, telegram_chat_id); the per-zone state file on the artifacts volume stops re-sends."
      tags:
        project: floodsense
        track: DAISI-B2
        role: ingest-score
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: Asia/Singapore
        pause_status: PAUSED
      environments:
        - environment_key: poller
          spec:
            client: "2"
            dependencies:
              - ${var.wheel_path}
      tasks:
        - task_key: poll_rainfall
          environment_key: poller
          timeout_seconds: 900
          spark_python_task:
            python_file: ${var.workspace_dir}/poll_rainfall.py
            parameters: ["--lookback-minutes", "40"]
        - task_key: refresh_pipeline
          depends_on:
            - task_key: poll_rainfall
          timeout_seconds: 1800
          pipeline_task:
            pipeline_id: ${resources.pipelines.floodsense.id}
            full_refresh: false
        - task_key: telegram_alerts
          depends_on:
            - task_key: refresh_pipeline
          environment_key: poller
          timeout_seconds: 240
          spark_python_task:
            python_file: ${var.workspace_dir}/telegram_bot.py
            parameters:
              - "--warehouse-id"
              - ${var.warehouse_id}
              - "live"
              - "--once"
              - "--state-file"
              - /Volumes/workspace/floodsense/artifacts/telegram_state.json

    daily_archiver:
      name: floodsense-daily-archiver
      description: "Daily: archives the last 3 days of NEA rain-area radar frames (data.gov.sg keeps only ~3 months) into the workspace.floodsense.radar volume, and the last 3 complete days of NEA rain-gauge readings into the pipeline's rainfall landing folder (landing/rainfall/daily). Days already archived are skipped."
      tags:
        project: floodsense
        track: DAISI-B2
        role: ingest-archive
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: Asia/Singapore
        pause_status: UNPAUSED
      environments:
        - environment_key: radar
          spec:
            client: "2"
            dependencies: [requests, pandas, pyarrow]
      tasks:
        - task_key: archive_radar
          environment_key: radar
          timeout_seconds: 1800
          spark_python_task:
            python_file: ${var.workspace_dir}/archive_radar.py
            parameters: ["--out-dir", "/Volumes/workspace/floodsense/radar", "--days-back", "3"]
        - task_key: archive_rainfall
          environment_key: radar
          timeout_seconds: 1800
          spark_python_task:
            python_file: ${var.workspace_dir}/archive_rainfall.py
            parameters: ["--days-back", "3"]

    flood_alerts:
      name: floodsense-flood-alerts
      description: "Every 15 min: lands recent PUB flash-flood alerts (data.gov.sg keeps no history) in the landing/flood_alerts folder that the floodsense pipeline reads. Only pages holding an alert are written. Pause it while the rainfall poller runs (the poller lands alerts too)."
      tags:
        project: floodsense
        track: DAISI-B2
        role: ingest-alerts
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: Asia/Singapore
        pause_status: UNPAUSED
      environments:
        - environment_key: alerts
          spec:
            client: "2"
            dependencies: [requests]
      tasks:
        - task_key: archive_flood_alerts
          environment_key: alerts
          timeout_seconds: 300
          spark_python_task:
            python_file: ${var.workspace_dir}/archive_flood_alerts.py
            parameters: ["--lookback-minutes", "20"]
